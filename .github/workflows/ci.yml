name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run all tests
        run: |
          pytest -q tests

      - name: Compile Python modules
        run: python -m compileall -q crawler ETL dataclass db observer search

      - name: API import smoke test
        env:
          DB_HOST: localhost
          DB_NAME: ci_dummy
          DB_READUSER: ci_readonly
          DB_READPASSWORD: ci_dummy_password
          DB_PORT: "5432"
        run: |
          python -c "import search.searcher; print('searcher import ok')"
