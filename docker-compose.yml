name: university-comparison-site

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: university-comparison-site:local
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile.etl
    image: university-comparison-etl:local
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    profiles:
      - etl
    volumes:
      - ./log:/app/log
    restart: "no"

  observe:
    build:
      context: .
      dockerfile: Dockerfile.observe
    image: university-comparison-observe:local
    env_file:
      - ${COMPOSE_ENV_FILE:-.env}
    profiles:
      - observe
    volumes:
      - ./log:/app/log
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data: